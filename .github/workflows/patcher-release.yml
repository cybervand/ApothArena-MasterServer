name: Publish patcher

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained single-file patcher
        run: dotnet publish Patcher/Patcher.csproj -c Release -r win-x64

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: Patcher/bin/Release/net8.0/win-x64/publish/ApotheonArenaMPpatch-harmony.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
